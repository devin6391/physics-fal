# Settings shared by every shot.

# Notion is the source of truth: every run reads the shots, prompts, frames and character
# images from it. These are the Notion field names the project reads.
notion:
  shots_data_source: 84f0353c-eb31-4810-8c44-87bd41c3b24a   # 🎥 Shots
  character_class: Character     # Asset Library rows of this Class become Kling elements
  fields:                        # 🎥 Shots
    shot: Shot
    section: Section
    order: Order
    model: Model
    duration: Duration (s)
    start_frame: Start frame
    end_frame: End frame
    elements: Elements
    type: Type
    generated_clip: Generated clip   # the clips scripts/assemble.js puts in the edit
    final_shot: Final shot
    prompt:
      characters: "Prompt: Characters"
      setting: "Prompt: Setting and look"
      camera: "Prompt: Camera"
      action: "Prompt: Action"
      dialogue: "Prompt: Dialogue"
      timing: "Prompt: Timing"
      environment: "Prompt: Environment"
      keep_still: "Prompt: Keep still"
  scenes_data_source: f03b3f2a-b9f4-432a-9b8f-9ce47e41d4d9   # 🎞 Film Structure — Scenes
  scene_fields:                  # 🎞 Film Structure — Scenes, for scripts/voice.js
    scene_no: Scene No
    scene: Scene
    sound_script: Sound script   # every voice line of the scene, with its tags and Stability
    voice_files: Voice files     # where the cut line files are uploaded
    sfx_files: Scene SFX audio   # where the scene's sounds are uploaded (scripts/sounds.js)
    radio_cut: Scene radio cut   # the fields scripts/upload.js fills, one per stage
    storyboard: Storyboard
    animatic: Animatic
    assembled: Assembled scene
  assets_data_source: d7aed21e-c389-42a2-aab9-fdeb0a420334   # 🎬 Asset Library
  asset_fields:                  # 🎬 Asset Library
    name: Asset
    class: Class
    face: Face close-up
    sheet: Reference Image

# The models a shot's Model field in Notion can name, and how each is called on fal. Shots set to
# any other Model (Free still, Cinema Studio 4.0 …) are not generated here.
# Prices are USD per second of video, from each model's fal page; check them if fal changes its prices.
models:
  Kling 3.0:
    endpoint: fal-ai/kling-video/v3/pro/image-to-video
    request: kling-v3
    usd_per_second: 0.112        # audio off ($0.168 with audio)
    max_seconds: 15
  Kling 4.0:
    endpoint: fal-ai/kling-video/v4/image-to-video
    request: kling-v4            # no character elements, negative prompt or audio setting on fal
    usd_per_second: 0.157
    resolution: 1080p            # 720p or 1080p
    max_seconds: 15

# A clip is generated this many seconds longer at each end than its length in the scene (Duration in
# Notion), rounded up to whole seconds; the edit uses the middle, where clips are cleanest.
clip_handles: 1

# Sound is made separately (voices, SFX, beds), so Kling's own audio stays off.
# Kling 4.0 on fal has no audio setting, so this applies to Kling 3.0 only.
audio: false

# How many clips run on fal at the same time.
parallel: 4

# Uploaded images are kept on fal's storage this long, and reused until a few days before.
upload_expiry: 30d

negative_prompt: >-
  duplicate objects, extra phone, extra people, morphing face, extra fingers,
  merged hands, looking at camera, camera shake, cuts, flicker, slow motion,
  text, subtitles, watermark, blur, distort, low quality

# Appended to every shot's KEEP STILL section, after the shot's own lines.
keep_still_standard: >-
  One continuous shot, no cuts. The camera does only what CAMERA says. Only the
  people named in CHARACTERS appear, each exactly once, and each keeps the same
  face from the first frame to the last. Every object exists exactly once:
  nothing is duplicated, nothing appears from nowhere, nothing vanishes; an
  object that is put down stays where it was put down. Hands have five fingers
  and never merge with objects. No one looks into the camera. No mouth moves
  unless DIALOGUE says so. The light stays as set. Normal speed, no slow motion.
  No text, subtitles, logos or watermark.

# Voices for the dialogue, made on ElevenLabs by scripts/voice.js from a scene's Sound script in Notion.
# Every speaker or voice the Sound script names needs a voice id here (node scripts/voice.js --voices lists them).
# Which voice plays which character is Vineet's call. Stability comes from the Sound script, line by line.
voice:
  model: eleven_v4
  output_format: mp3_44100_128
  similarity_boost: 0.75
  pause: "[long pause]"          # put between a speaker's lines in one request; the lines are cut apart at these pauses
  split:                         # how the pauses are found (ffmpeg silencedetect) and how much room each line keeps
    silence_db: -40
    min_silence: 0.35
    lead: 0.05
    tail: 0.2
  speakers:
    Aryan: 2EPjvJugCT0wHVINlgdZ          # aryan 19 yr
    Priya: X1aCu8g69vgtNfFwu68G          # Neha P (her lines go through the Phone filter in the cold open)
    Narrator: JgIX0wzVL9nMx64BRm05
    Auto driver: x3I60lc1eeBSTsQ7sT6I
    Shopkeeper: XxQtFmwKGEygx1x7UMJ5
    Hostel boy A: KfwNTJ4LG6Kz5gi0fnqc
    Hostel boy B: 31T7D6zKHWBWvJlibBzI
    Hostel boy C: u3v81nA6jgD2f8PNeClc
    Gudda:                               # not chosen yet: the voice that shouldn't exist

# Every other sound a scene needs, made on ElevenLabs Sound Effects by scripts/sounds.js from the SOUNDS
# section of the scene's Sound script. Motifs are made once and locked in the Asset Library, never here.
sound:
  model: eleven_text_to_sound_v3
  output_format: mp3_44100_128
  prompt_influence: 0.3          # higher follows the prompt more closely, with less variety
  credits_per_second: 40         # ElevenLabs' price when the length is set
