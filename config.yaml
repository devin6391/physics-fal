# Settings shared by every shot.

# Notion is the source of truth: every run reads the shots, prompts, frames and character
# images from it. These are the Notion field names the project reads.
notion:
  shots_data_source: 84f0353c-eb31-4810-8c44-87bd41c3b24a   # 🎥 Shots
  character_class: Character     # Asset Library rows of this Class become Kling elements
  fields:                        # 🎥 Shots
    shot: Shot
    section: Section
    order: Order
    model: Model
    duration: Duration (s)
    start_frame: Start frame
    end_frame: End frame
    elements: Elements
    prompt:
      characters: "Prompt: Characters"
      setting: "Prompt: Setting and look"
      camera: "Prompt: Camera"
      action: "Prompt: Action"
      dialogue: "Prompt: Dialogue"
      timing: "Prompt: Timing"
      environment: "Prompt: Environment"
      keep_still: "Prompt: Keep still"
    dialogue_lines: Dialogue lines       # what is spoken, for voice.js; when empty, voice.js reads Screenplay audio
    screenplay_audio: Screenplay audio
  asset_fields:                  # 🎬 Asset Library
    name: Asset
    class: Class
    face: Face close-up
    sheet: Reference Image

# The models a shot's Model field in Notion can name, and how each is called on fal. Shots set to
# any other Model (Free still, Cinema Studio 4.0 …) are not generated here.
# Prices are USD per second of video, from each model's fal page; check them if fal changes its prices.
models:
  Kling 3.0:
    endpoint: fal-ai/kling-video/v3/pro/image-to-video
    request: kling-v3
    usd_per_second: 0.112        # audio off ($0.168 with audio)
  Kling 4.0:
    endpoint: fal-ai/kling-video/v4/image-to-video
    request: kling-v4            # no character elements, negative prompt or audio setting on fal
    usd_per_second: 0.157
    resolution: 1080p            # 720p or 1080p

# Sound is made separately (voices, SFX, beds), so Kling's own audio stays off.
# Kling 4.0 on fal has no audio setting, so this applies to Kling 3.0 only.
audio: false

# How many clips run on fal at the same time.
parallel: 4

# Uploaded images are kept on fal's storage this long, and reused until a few days before.
upload_expiry: 30d

negative_prompt: >-
  duplicate objects, extra phone, extra people, morphing face, extra fingers,
  merged hands, looking at camera, camera shake, cuts, flicker, slow motion,
  text, subtitles, watermark, blur, distort, low quality

# Appended to every shot's KEEP STILL section, after the shot's own lines.
keep_still_standard: >-
  One continuous shot, no cuts. The camera does only what CAMERA says. Only the
  people named in CHARACTERS appear, each exactly once, and each keeps the same
  face from the first frame to the last. Every object exists exactly once:
  nothing is duplicated, nothing appears from nowhere, nothing vanishes; an
  object that is put down stays where it was put down. Hands have five fingers
  and never merge with objects. No one looks into the camera. No mouth moves
  unless DIALOGUE says so. The light stays as set. Normal speed, no slow motion.
  No text, subtitles, logos or watermark.

# Voices for the dialogue, made on ElevenLabs by scripts/voice.js (mixed in CapCut, like all sound).
# Each speaker as written in Notion ("Priya (softly): …") needs a voice id here. These are first
# picks from the account's Hindi voices to audition; swap any id (node scripts/voice.js --voices lists them).
voice:
  model: eleven_v4
  output_format: mp3_44100_128
  stability: 0.5           # lower = more emotional range, higher = steadier
  similarity_boost: 0.75
  speakers:
    Aryan: xoiRqQNYNTfj1xSWG43x      # Krish - Nervous, Anxious Character
    Priya: X1aCu8g69vgtNfFwu68G
    Narrator: x3I60lc1eeBSTsQ7sT6I   # Danish Khan - Deep, Tense, Anticipatory
    Gudda:                           # not chosen yet: the voice that shouldn't exist
